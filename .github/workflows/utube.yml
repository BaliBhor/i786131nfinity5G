name: Up luo - Youtube to M3U
on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours to refresh links before they expire
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (yt-dlp)
        run: |
          sudo wget https://github.com -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          pip install requests

      - name: Clean Local Workspace
        run: rm -f *.m3u

      - name: Generate YouTube Stream M3U
        run: python utube.py

      - name: Checkout Destination Public Repository
        uses: actions/checkout@v4
        with:
          repository: 'BaliBhor/i786131nfinity5G'
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: 'public-dest'

      - name: Move, Commit and Push to Public Repository
        run: |
          # 1. Create the secret3 folder if it doesn't exist
          mkdir -p public-dest/secret6
          
          # 2. Check if any .m3u files exist before trying to move them
          if ls *.m3u 1> /dev/null 2>&1; then
            mv *.m3u public-dest/secret6/
            echo "Successfully moved playlist files."
          else
            echo "Warning: No .m3u files found to move!"
          fi
          
          # 3. Create a robots.txt file INSIDE the secret3 folder
          cat << 'EOF' > public-dest/secret6/robots.txt
          User-agent: *
          Disallow: /
          EOF
          
          # 4. Create a styled error index.html page INSIDE the secret3 folder
          cat << 'EOF' > public-dest/secret6/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <title>Site Maintenance</title>
              <meta name="robots" content="noindex, nofollow">
              <style>
                  * {
                      margin:0px auto;
                      padding: 0px;
                      text-align:center;
                  }
                  body {
                      background-color: #D4D9ED;
                  }
                  .cont_principal {
                      position: absolute;  
                      width: 100%;
                      height: 100%;
                      overflow: hidden;
                  }
                  .cont_error {
                      position: absolute;
                      width: 100%;
                      height: 300px;
                      top: 50%;
                      margin-top:-150px;
                  }
                  .cont_error > h1  {
                      font-family: 'Lato', sans-serif;  
                      font-weight: 400;
                      font-size:150px;
                      color:#fff;
                      position: relative;
                      left:-100%;
                      transition: all 0.5s;
                  }
                  .cont_error > p  {
                      font-family: 'Lato', sans-serif;  
                      font-weight: 300;
                      font-size:24px;
                      letter-spacing: 5px;
                      color:#9294AE;
                      position: relative;
                      left:100%;
                      transition: all 0.5s;
                      transition-delay: 0.5s;
                      -webkit-transition: all 0.5s;
                      -webkit-transition-delay: 0.5s;
                  }
                  .cont_aura_1 {
                      position:absolute;
                      width:300px;
                      height: 120%;
                      top:25px;
                      right: -340px;
                      background-color: #8A65DF;
                      box-shadow: 0px 0px  60px  20px  rgba(137,100,222,0.5);
                      -webkit-transition: all 0.5s;
                      transition: all 0.5s;
                  }
                  .cont_aura_2 {
                      position:absolute;
                      width:100%;
                      height: 300px;
                      right:-10%;
                      bottom:-301px;
                      background-color: #8B65E4;
                      box-shadow: 0px 0px 60px 10px rgba(131, 95, 214, 0.5),0px 0px  20px  0px  rgba(0,0,0,0.1);
                      z-index:5;
                      transition: all 0.5s;
                      -webkit-transition: all 0.5s;
                  }
                  .cont_error_active > .cont_error > h1 {
                      left:0%;
                  }
                  .cont_error_active > .cont_error > p {
                      left:0%;
                  }
                  .cont_error_active > .cont_aura_2 {
                      animation-name: animation_error_2;
                      animation-duration: 4s;
                      animation-timing-function: linear;
                      animation-iteration-count: infinite;
                      animation-direction: alternate;
                      transform: rotate(-20deg);    
                  }
                  .cont_error_active > .cont_aura_1 {
                      transform: rotate(20deg);
                      right:-170px;
                      animation-name: animation_error_1;
                      animation-duration: 4s;
                      animation-timing-function: linear;
                      animation-iteration-count: infinite;
                      animation-direction: alternate;
                  }
                  @keyframes animation_error_1 {
                      from { transform: rotate(20deg); }
                      to { transform: rotate(25deg); }
                  }
                  @keyframes animation_error_2 {
                      from { transform: rotate(-15deg); }
                      to { transform: rotate(-20deg); }
                  }
              </style>
          </head>
          <body> 
              <div class="cont_principal">
                  <div class="cont_error">
                      <h1>Oops</h1>  
                      <p>The Page you're looking for isn't here.</p>
                  </div>
                  <div class="cont_aura_1"></div>
                  <div class="cont_aura_2"></div>
              </div>
              <script>
                  window.onload = function(){
                      document.querySelector('.cont_principal').className= "cont_principal cont_error_active";  
                  }
              </script>
          </body>
          </html>
          EOF
          
          cd public-dest
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 5. Stage everything
          git add -A
          
          # 6. Push commit with forced empty commit flag to refresh the timestamp
          git commit --allow-empty -m "Update YouTube Streams: Auto-refresh links ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)"
          git pull --rebase origin main
          git push origin main
